<section class="card">
  <header class="card-header">
    <h2 class="card-title">Client</h2>
    <span class="badge badge-neutral">#{{ displayData()?.clientId }}</span>
  </header>
  <div class="card-body flex flex-col gap-5 sm:flex-row">
    <img
      class="size-28 shrink-0 rounded-xl bg-slate-100 object-cover object-center"
      [src]="displayData()?.avatar"
      alt="Avatar"
      (error)="onImgError($event)"
    />
    <dl class="grid min-w-0 flex-1 grid-cols-1 gap-x-6 gap-y-3 sm:grid-cols-2">
      <div>
        <dt class="text-xs text-slate-500">Id</dt>
        <dd class="text-sm text-slate-900">{{ displayData()?.clientId }}</dd>
      </div>
      <div>
        <dt class="text-xs text-slate-500">Name</dt>
        <dd class="text-sm text-slate-900">{{ displayData()?.name }}</dd>
      </div>
      <div>
        <dt class="text-xs text-slate-500">Birthdate</dt>
        <dd class="text-sm text-slate-900">
          {{ displayData()?.birthdate | date }}
        </dd>
      </div>
      <div>
        <dt class="text-xs text-slate-500">Email</dt>
        <dd class="truncate text-sm text-slate-900">
          {{ displayData()?.email }}
        </dd>
      </div>
      <div>
        <dt class="text-xs text-slate-500">Registered At</dt>
        <dd class="text-sm text-slate-900">
          {{ displayData()?.registeredAt | date }}
        </dd>
      </div>
    </dl>
  </div>
</section>
