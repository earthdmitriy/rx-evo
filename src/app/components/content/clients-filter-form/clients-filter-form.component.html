<form [formGroup]="filters" class="card card-body">
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
    <div>
      <label class="label" for="filter-name">Name</label>
      <input
        id="filter-name"
        type="text"
        formControlName="name"
        class="input"
      />
    </div>
    <div>
      <label class="label" for="filter-email">Email</label>
      <input
        id="filter-email"
        type="email"
        formControlName="email"
        class="input"
      />
    </div>
    <div>
      <label class="label" for="filter-registered-after"
        >Registered After</label
      >
      <input
        id="filter-registered-after"
        type="date"
        formControlName="registeredAfter"
        class="input"
      />
    </div>
    <div>
      <label class="label" for="filter-registered-before"
        >Registered Before</label
      >
      <input
        id="filter-registered-before"
        type="date"
        formControlName="registeredBefore"
        class="input"
      />
    </div>
  </div>
</form>
