<div data-testid="state-block" [class.loading]="loading()">
  @if (error(); as error) {
    <app-generic-error
      class="relative z-50 block"
      [error]="error"
      [showReload]="true"
      (reload)="retry.emit()"
    ></app-generic-error>
  } @else {
    <ng-content></ng-content>
  }
</div>
