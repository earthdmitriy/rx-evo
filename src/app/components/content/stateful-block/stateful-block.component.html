@if (stream(); as stream) {
  @if (isInactive(stream.raw$ | async)) {
    <div class="empty-state">{{ inactiveText() }}</div>
  } @else {
    <div data-testid="state-block" [class.loading]="stream.pending$ | async">
      @if (stream.error$ | async; as error) {
        <app-generic-error
          [error]="error"
          [showReload]="true"
          (reload)="stream.reload()"
        ></app-generic-error>
      } @else {
        <ng-content></ng-content>
      }
    </div>
  }
}
