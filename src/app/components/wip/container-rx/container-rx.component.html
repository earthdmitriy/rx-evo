<div class="flex flex-col gap-4">
  <div
    class="flex flex-col gap-4"
    [class.loading]="clientRequest.loading$ | async"
  >
    @if (clientRequest.error$ | async) {
      <app-generic-error text="Failed to load client"></app-generic-error>
    }
    @if (clientRequest.data$ | async; as data) {
      <app-client-info [displayData]="data"></app-client-info>
    }
  </div>

  @if (showBucket) {
    <div
      class="flex flex-col gap-4"
      [class.loading]="combined.loading$ | async"
    >
      @if (combined.error$ | async) {
        <app-generic-error text="Failed to load bucket"></app-generic-error>
      }
      @if (combinedData$ | async; as data) {
        <app-client-bucket [bucket]="data"></app-client-bucket>
      }
    </div>
  }
</div>
