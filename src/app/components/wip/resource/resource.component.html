<div class="flex flex-col gap-4">
  <div class="flex flex-col gap-4" [class.loading]="clientResource.isLoading()">
    @if (clientResource.error()) {
      <app-generic-error
        text="Failed to load client"
        [showReload]="true"
        (reload)="clientResource.reload()"
      ></app-generic-error>
    }
    @if (clientResource.hasValue()) {
      <app-client-info [displayData]="clientResource.value()"></app-client-info>
    }
  </div>

  @if (showBucket()) {
    <div
      class="flex flex-col gap-4"
      [class.loading]="populatedBucketResource.isLoading()"
    >
      @if (populatedBucketResource.error()) {
        <app-generic-error
          text="Failed to load bucket"
          [showReload]="true"
          (reload)="populatedBucketResource.reload()"
        ></app-generic-error>
      }
      @if (populatedBucketResource.hasValue()) {
        <app-client-bucket [bucket]="populatedBucketResource.value()"></app-client-bucket>
      }
    </div>
  }
</div>
