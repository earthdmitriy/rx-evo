<div class="flex flex-col gap-4">
  <div
    class="flex flex-col gap-4"
    [class.loading]="clientStore.loading | async"
  >
    @if (clientStore.error | async; as error) {
      <app-generic-error
        [showReload]="true"
        [text]="error"
        (reload)="clientStore.reload()"
      ></app-generic-error>
    } @else {
      @if (clientStore.data | async; as data) {
        <app-client-info [displayData]="data"></app-client-info>
      }
    }
  </div>

  @if (showBucket()) {
    <div
      class="flex flex-col gap-4"
      [class.loading]="populatedBucketStore.loading | async"
    >
      @if (populatedBucketStore.error | async; as errors) {
        @for (error of errors; track error) {
          @if (error) {
            <app-generic-error
              [showReload]="true"
              [text]="error"
              (reload)="populatedBucketStore.reload()"
            ></app-generic-error>
          }
        }
      } @else {
        @if (populatedBucketStore.data | async; as data) {
          <app-client-bucket [bucket]="data"></app-client-bucket>
        }
      }
    </div>
  }
</div>
